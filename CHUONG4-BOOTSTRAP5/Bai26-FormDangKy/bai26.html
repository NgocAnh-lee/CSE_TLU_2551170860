<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bai26</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center min-vh-100 py-4">
    
    <div class="container" style="max-width: 600px;">

        <div class="card shadow-sm border-0 rounded-3 overflow-hidden">
            
            <div class="card-header bg-success text-white text-center py-3">
                <h4 class="mb-0 fw-bold">Đăng ký tham gia CLB Lập trình Web</h4>
            </div>

            <div class="card-body p-4">
                <form class="row g-3">
                    
                    <div class="col-md-6">
                        <label for="fullName" class="form-label fw-medium">Họ và tên</label>
                        <input type="text" class="form-control" id="fullName" placeholder="Nguyễn Văn A" required>
                    </div>

                    <div class="col-md-6">
                        <label for="studentId" class="form-label fw-medium">Mã sinh viên</label>
                        <input type="text" class="form-control" id="studentId" placeholder="22xxxxxx" required>
                    </div>

                    <div class="col-md-6">
                        <label for="email" class="form-label fw-medium">Email</label>
                        <input type="email" class="form-control" id="email" placeholder="sv@tlu.edu.vn" required>
                    </div>

                    <div class="col-md-6">
                        <label for="phone" class="form-label fw-medium">Số điện thoại</label>
                        <input type="tel" class="form-control" id="phone" placeholder="09xxxxxxxx" required>
                    </div>

                    <div class="col-12">
                        <label class="form-label fw-medium d-block">Trình độ</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="level" id="level1" value="CoBan" checked required>
                            <label class="form-check-label" for="level1">Cơ bản</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="level" id="level2" value="Kha" required>
                            <label class="form-check-label" for="level2">Khá</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="level" id="level3" value="Tot" required>
                            <label class="form-check-label" for="level3">Tốt</label>
                        </div>
                    </div>

                    <div class="col-12">
                        <label for="classSelect" class="form-label fw-medium">Chọn lớp</label>
                        <select class="form-select" id="classSelect" required>
                            <option value="67CNTT1" selected>67CNTT1</option>
                            <option value="67CNTT2">67CNTT2</option>
                            <option value="67KTPM1">67KTPM1</option>
                            <option value="67KTPM2">67KTPM2</option>
                            <option value="67HTTT1">67HTTT1</option>
                            <option value="67HTTT2">67HTTT2</option>
                        </select>
                    </div>

                    <div class="col-12">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="commitCheck" checked required>
                            <label class="form-check-label fw-medium" for="commitCheck">
                                Tôi cam kết tự làm bài và quay video OBS
                            </label>
                        </div>
                    </div>

                    <div class="col-12 d-flex justify-content-end gap-2 mt-4">
                        <button type="reset" class="btn btn-outline-secondary px-4">Nhập lại</button>
                        <button type="submit" class="btn btn-success px-4">Đăng ký</button>
                    </div>

                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
