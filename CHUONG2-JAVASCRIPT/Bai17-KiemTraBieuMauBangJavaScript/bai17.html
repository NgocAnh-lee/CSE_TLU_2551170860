<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="bai17.css">
    <title>Bai17</title>
</head>
<body>
    <div class="container">
        <div class="content">
            <div class="title">
                <p>
                    Đăng ký tài khoản
                </p>
                <p>
                    Dữ liệu được kiểm tra bằng JavaScript trước khi gửi
                </p>
            </div>

            <form>
                <div class="in">
                    <label for="hoten">Họ và tên</label>
                    <input type="text" id="hoten">
                    <small class="message"></small>
                </div>

                <div class="in">
                    <label for="email">Email</label>
                    <input type="email" id="email">
                    <small class="message"></small>
                </div>

                <div class="in">
                    <label for="password">Mật khẩu</label>
                    <input type="password" id="password">
                    <small class="message"></small>
                </div>

                <div class="in">
                    <label for="checkpassword">Xác nhận mật khẩu</label>
                    <input type="password" id="checkpassword">
                    <small class="message"></small>
                </div>

                <button type="button">Đăng ký</button>
            </form>
        </div>
    </div>

    <script src="bai17.js"></script>
</body>
</html>
