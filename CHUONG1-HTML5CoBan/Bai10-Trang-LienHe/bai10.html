<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="bai10.css">
    <title>bai10</title>
</head>

<body>
    <div class="container">
        <div class="title">
            <h1>
                Liên hệ với chúng tôi
            </h1>
            <p>
                Vui lòng điền thông tin bên dưới, chúng tôi sẽ phản hồi trong 24 giờ.
            </p>
        </div>

        <form>
            <div class="row">
                <div class="form-group">
                    <label for="name">Họ và tên</label>
                    <input type="text" id="name">
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email">
                </div>
            </div>

            <div class="row">
                <div class="form-group">
                    <label for="sdt">Số điện thoại</label>
                    <input type="tel" id="sdt">
                </div>

                <div class="form-group">
                    <label for="subject">Chủ đề</label>
                    <select name="subject" id="subject">
                        <option>Hỏi về khóa học</option>
                        <option>Hỏi về học phí</option>
                        <option>Hỏi về lịch học</option>
                        <option>Hỏi về địa điểm</option>
                        <option>Khác</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="content">Nội dung</label>
                <textarea id="content" rows="5">Em muốn hỏi về lịch nộp bài tập môn Lập trình Web ạ.</textarea>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="agree" checked>
                <label for="agree">
                    Tôi đồng ý nhận email phản hồi.
                </label>
            </div>

            <div class="buttons">
                <button type="submit">Gửi liên hệ</button>
                <button type="reset">Nhập lại</button>
            </div>
        </form>
    </div>
</body>

</html>
